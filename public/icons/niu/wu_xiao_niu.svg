<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- 五小牛：5张小牌 -->
  <circle cx="32" cy="32" r="28" fill="#1a0a2e" stroke="#06ffa5" stroke-width="2"/>
  <!-- 5张小牌 -->
  <rect x="6"  y="22" width="14" height="20" rx="2" fill="#fff" stroke="#ddd" stroke-width="1"/>
  <rect x="13" y="20" width="14" height="20" rx="2" fill="#fff" stroke="#ddd" stroke-width="1"/>
  <rect x="25" y="18" width="14" height="20" rx="2" fill="#fff" stroke="#ddd" stroke-width="1"/>
  <rect x="37" y="20" width="14" height="20" rx="2" fill="#fff" stroke="#ddd" stroke-width="1"/>
  <rect x="44" y="22" width="14" height="20" rx="2" fill="#fff" stroke="#ddd" stroke-width="1"/>
  <!-- 小数字 -->
  <text x="13" y="35" font-family="serif" font-size="9" font-weight="bold" fill="#222" text-anchor="middle">2</text>
  <text x="20" y="33" font-family="serif" font-size="9" font-weight="bold" fill="#e74c3c" text-anchor="middle">3</text>
  <text x="32" y="31" font-family="serif" font-size="9" font-weight="bold" fill="#222" text-anchor="middle">A</text>
  <text x="44" y="33" font-family="serif" font-size="9" font-weight="bold" fill="#e74c3c" text-anchor="middle">4</text>
  <text x="51" y="35" font-family="serif" font-size="9" font-weight="bold" fill="#222" text-anchor="middle">5</text>
  <!-- 底部标签 -->
  <rect x="10" y="50" width="44" height="10" rx="4" fill="#06ffa5" opacity="0.9"/>
  <text x="32" y="58" font-family="sans-serif" font-size="7" font-weight="bold" fill="#0a0014" text-anchor="middle">五小牛 3X</text>
</svg>
