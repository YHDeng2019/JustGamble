<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- 炸弹：4张同点牌 -->
  <circle cx="32" cy="32" r="28" fill="#1a0a2e" stroke="#00f5ff" stroke-width="2"/>
  <!-- 4张牌叠放 -->
  <rect x="10" y="18" width="22" height="30" rx="3" fill="#f8f9fa" stroke="#ccc" stroke-width="1" transform="rotate(-10,21,33)"/>
  <rect x="14" y="16" width="22" height="30" rx="3" fill="#f0f0ff" stroke="#ccc" stroke-width="1" transform="rotate(-3,25,31)"/>
  <rect x="18" y="15" width="22" height="30" rx="3" fill="#fff" stroke="#ccc" stroke-width="1" transform="rotate(4,29,30)"/>
  <rect x="22" y="14" width="22" height="30" rx="3" fill="#fff8f8" stroke="#ccc" stroke-width="1" transform="rotate(11,33,29)"/>
  <!-- 顶牌数字 -->
  <text x="34" y="27" font-family="serif" font-size="13" font-weight="bold" fill="#e74c3c" text-anchor="middle" transform="rotate(11,34,27)">A</text>
  <!-- 爆炸光芒 -->
  <circle cx="46" cy="18" r="8" fill="#ffd60a" opacity="0.85"/>
  <text x="46" y="22" font-family="sans-serif" font-size="10" font-weight="bold" fill="#c0392b" text-anchor="middle">4X</text>
  <!-- 底部标签 -->
  <rect x="14" y="51" width="36" height="10" rx="4" fill="#00f5ff" opacity="0.85"/>
  <text x="32" y="59" font-family="sans-serif" font-size="7" font-weight="bold" fill="#0a0014" text-anchor="middle">炸 弹</text>
</svg>
